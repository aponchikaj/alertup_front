# FX-025: lint, tests and the verification build gate every push and PR.
# Vercel only runs the build; make "verify" a required check on pre-prod and
# main in the GitHub branch-protection settings.
name: CI

on:
  push:
    branches: [stage, pre-prod, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
