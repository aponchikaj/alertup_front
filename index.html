<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Paint the correct theme before first paint. Without this the page
         flashes light before React mounts. Must stay inline and blocking. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("alertup-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.backgroundColor =
            theme === "dark" ? "#0a0a0a" : "#ffffff";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <!-- ====================================================================
         Everything between the seo markers is per-route metadata. It is
         rewritten at build time by scripts/generate-seo.mjs (one static HTML
         file per indexable route) and at runtime by <Seo /> (src/seo/Seo.tsx).
         Keep the markers intact and edit src/seo/seo.data.json instead.
         ================================================================= -->
    <!--seo:start-->
    <title>AlertUp — QR Code Evacuation Routes &amp; Escape Maps</title>
    <meta data-seo name="description" content="Scan a QR code and instantly see the safest way out of any building. AlertUp turns official escape maps into instant evacuation routes — no app install." />
    <meta data-seo name="keywords" content="emergency evacuation QR code, building evacuation map, escape route app, fire safety QR code, digital fire escape plan" />
    <meta data-seo name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta data-seo name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link data-seo rel="canonical" href="https://alertup.world/" />

    <meta data-seo property="og:site_name" content="AlertUp" />
    <meta data-seo property="og:type" content="website" />
    <meta data-seo property="og:locale" content="en_US" />
    <meta data-seo property="og:title" content="AlertUp — QR Code Evacuation Routes &amp; Escape Maps" />
    <meta data-seo property="og:description" content="Scan a QR code and instantly see the safest way out of any building. AlertUp turns official escape maps into instant evacuation routes — no app install." />
    <meta data-seo property="og:url" content="https://alertup.world/" />
    <meta data-seo property="og:image" content="https://alertup.world/og-image.png" />
    <meta data-seo property="og:image:width" content="1200" />
    <meta data-seo property="og:image:height" content="630" />
    <meta data-seo property="og:image:alt" content="AlertUp — scan once, find the safest way out" />

    <meta data-seo name="twitter:card" content="summary_large_image" />
    <meta data-seo name="twitter:title" content="AlertUp — QR Code Evacuation Routes &amp; Escape Maps" />
    <meta data-seo name="twitter:description" content="Scan a QR code and instantly see the safest way out of any building. AlertUp turns official escape maps into instant evacuation routes — no app install." />
    <meta data-seo name="twitter:image" content="https://alertup.world/og-image.png" />
    <meta data-seo name="twitter:image:alt" content="AlertUp — scan once, find the safest way out" />
    <!--seo:end-->

    <meta name="author" content="Lazare Mirziashvili" />
    <meta name="application-name" content="AlertUp" />
    <meta name="apple-mobile-web-app-title" content="AlertUp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- The API lives on another origin; warm the connection before React asks for it. -->
    <link rel="preconnect" href="https://alertup-backend.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://alertup-backend.onrender.com" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Crawlers that do not execute JavaScript, and users with it disabled,
         still get the page's actual subject matter. Rewritten per route by
         scripts/generate-seo.mjs. -->
    <noscript>
      <!--seo:noscript:start-->
      <h1>AlertUp — scan once, find the safest way out</h1>
      <p>
        AlertUp is a building safety platform that gives anyone instant access to
        evacuation routes through QR codes. Building owners upload their official
        escape and evacuation maps, generate a QR code for every floor and
        location, and print them around the building. When someone scans, they
        immediately see the safest path to an exit.
      </p>
      <ul>
        <li>Emergency instructions tailored to the building and the type of emergency.</li>
        <li>Per-floor escape route maps showing exits and safe paths.</li>
        <li>QR code access with no app to install.</li>
      </ul>
      <p><a href="/scan">Scan a QR code</a> · <a href="/register">Create a free account</a> · <a href="/contact">Contact us</a></p>
      <!--seo:noscript:end-->
      <p>JavaScript is required for the scanner. Please enable it and reload the page.</p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
